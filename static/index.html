<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REWE Preisarchiv</title><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Preisarchiv"><link rel="manifest" href="/manifest.webmanifest"><style>
:root{--bg:#f4f5f7;--card:#fff;--text:#17191c;--muted:#6b7280;--border:#e5e7eb;--accent:#cc071e;--good:#12833a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:4}.wrap{max-width:1180px;margin:0 auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:23px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef0f3;color:#222}.controls{display:grid;grid-template-columns:1fr 220px auto;gap:10px;margin:18px 0}input,select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:15px}.status{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:12px 0 18px}.status strong{color:var(--text)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:14px;display:grid;grid-template-columns:72px 1fr;gap:13px;min-height:142px}.thumb{width:72px;height:72px;border-radius:11px;object-fit:contain;background:#f7f7f7;border:1px solid #eee}.placeholder{width:72px;height:72px;border-radius:11px;background:#eceff1;display:grid;place-items:center;color:#a3a3a3;font-size:25px}.name{font-weight:800;line-height:1.22}.meta{font-size:12px;color:var(--muted);margin-top:4px;min-height:16px}.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.price{font-size:23px;font-weight:900}.graphbtn{width:38px;height:38px;padding:0;border-radius:50%;background:#f1f3f5;display:grid;place-items:center;font-size:19px}.graphbtn.active{background:#eaf5ee;color:var(--good)}.range{font-size:11px;color:var(--muted);margin-top:2px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.open{display:flex}.dialog{background:#fff;border-radius:17px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:19px}.dialog-head{display:flex;justify-content:space-between;align-items:flex-start}.close{background:#f1f2f4;padding:7px 10px}#chart{width:100%;height:280px;margin-top:18px;border-left:1px solid #ddd;border-bottom:1px solid #ddd}.history-list{margin-top:15px;border-top:1px solid var(--border)}.hist{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 2px;border-bottom:1px solid var(--border);font-size:13px}.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:12px 14px;border-radius:10px;display:none;z-index:40;max-width:360px}@media(max-width:650px){.controls{grid-template-columns:1fr}.top{align-items:flex-start}.top button{white-space:nowrap}.wrap{padding:13px}.card{grid-template-columns:62px 1fr}.thumb,.placeholder{width:62px;height:62px}}
</style></head><body><header><div class="wrap top"><div><h1>REWE Preisarchiv</h1><div class="sub">Industriestraße 40 · Flörsheim-Weilbach</div></div><button id="updateBtn" class="primary">↻ Angebote aktualisieren</button></div></header><main class="wrap"><div class="controls"><input id="search" placeholder="Produkt suchen …"><select id="category"><option value="">Alle Kategorien</option></select><button id="demoBtn" class="secondary">Demodaten zurücksetzen</button></div><div class="status" id="status"></div><div class="grid" id="grid"></div></main><div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><div><div class="name" id="modalName"></div><div class="meta" id="modalMeta"></div></div><button class="close" id="closeModal">✕</button></div><svg id="chart" viewBox="0 0 680 280" preserveAspectRatio="none"></svg><div class="history-list" id="historyList"></div></div></div><div class="toast" id="toast"></div><script>
const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n),dateDE=s=>s?new Date(s).toLocaleDateString('de-DE'):'–';let products=[];async function api(url,opts={}){opts.headers={...(opts.headers||{})};const token=localStorage.getItem('adminToken');if(token)opts.headers['x-admin-token']=token;const r=await fetch(url,opts),data=await r.json();if(!r.ok){if(r.status===401){const t=prompt('Admin-Token eingeben:');if(t){localStorage.setItem('adminToken',t);return api(url,opts)}}throw Object.assign(new Error(data.message||data.detail||'Fehler'),{data})}return data}function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',4200)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function load(){const[s,c,p]=await Promise.all([api('/api/status'),api('/api/categories'),api('/api/products')]);products=p;document.getElementById('status').innerHTML=`<span><strong>${s.products}</strong> Produkte</span><span><strong>${s.observations}</strong> Preisstände</span><span>Letzter Stand: <strong>${dateDE(s.last_update)}</strong></span>`;const sel=document.getElementById('category'),current=sel.value;sel.innerHTML='<option value="">Alle Kategorien</option>'+c.map(x=>`<option>${esc(x.category)}</option>`).join('');sel.value=current;render()}function render(){const q=document.getElementById('search').value.toLowerCase().trim(),cat=document.getElementById('category').value,rows=products.filter(p=>(!q||`${p.brand||''} ${p.name} ${p.variant||''} ${p.quantity||''}`.toLowerCase().includes(q))&&(!cat||p.category===cat));document.getElementById('grid').innerHTML=rows.map(p=>{const img=p.thumb_path?`<img class="thumb" src="${esc(p.thumb_path)}" alt="">`:`<div class="placeholder">▧</div>`,graph=Number(p.distinct_price_count)>1;return `<div class="card">${img}<div><div class="name">${esc(p.name)}</div><div class="meta">${esc([p.brand,p.variant,p.quantity,p.category].filter(Boolean).join(' · '))}</div><div class="price-row"><div><div class="price">${euro(p.current_price)}</div>${graph?`<div class="range">${euro(p.min_price)} – ${euro(p.max_price)}</div>`:''}</div><button class="graphbtn ${graph?'active':''}" ${graph?'':'disabled title="Noch kein Preisverlauf"'} onclick="showHistory(${p.id})">📈</button></div></div></div>`}).join('')}
async function showHistory(id){const d=await api(`/api/products/${id}/history`);document.getElementById('modalName').textContent=d.product.name;document.getElementById('modalMeta').textContent=[d.product.brand,d.product.quantity].filter(Boolean).join(' · ');drawChart(d.history);document.getElementById('historyList').innerHTML=d.history.slice().reverse().map(h=>`<div class="hist"><span>${dateDE(h.observed_at)} ${h.source_type?`· ${esc(h.source_type)}`:''}</span><strong>${euro(h.price)}</strong></div>`).join('');document.getElementById('modal').classList.add('open')}function drawChart(h){const svg=document.getElementById('chart');svg.innerHTML='';if(!h.length)return;const W=680,H=280,pad=38,vals=h.map(x=>Number(x.price));let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=.5;max+=.5}const x=i=>pad+(W-pad*2)*(h.length===1?.5:i/(h.length-1)),y=v=>H-pad-(H-pad*2)*(v-min)/(max-min),ns='http://www.w3.org/2000/svg';for(let i=0;i<4;i++){const yy=pad+(H-pad*2)*i/3,ln=document.createElementNS(ns,'line');ln.setAttribute('x1',pad);ln.setAttribute('x2',W-pad);ln.setAttribute('y1',yy);ln.setAttribute('y2',yy);ln.setAttribute('stroke','#ececec');svg.appendChild(ln)}const pl=document.createElementNS(ns,'polyline');pl.setAttribute('points',h.map((v,i)=>`${x(i)},${y(v.price)}`).join(' '));pl.setAttribute('fill','none');pl.setAttribute('stroke','currentColor');pl.setAttribute('stroke-width','4');svg.appendChild(pl);h.forEach((v,i)=>{const c=document.createElementNS(ns,'circle');c.setAttribute('cx',x(i));c.setAttribute('cy',y(v.price));c.setAttribute('r','6');c.setAttribute('fill','currentColor');svg.appendChild(c)})}
document.getElementById('search').addEventListener('input',render);document.getElementById('category').addEventListener('change',render);document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')});document.getElementById('updateBtn').onclick=async()=>{const b=document.getElementById('updateBtn');b.disabled=true;b.textContent='Wird geladen …';try{const x=await api('/api/update',{method:'POST'});toast(`${x.saved} Angebote gespeichert (${x.mode}).`);await load()}catch(e){toast((e.data?.message||e.message)+(e.data?.errors?.length?' · '+e.data.errors.join(' | '):''))}finally{b.disabled=false;b.textContent='↻ Angebote aktualisieren'}};document.getElementById('demoBtn').onclick=async()=>{await api('/api/reset-demo',{method:'POST'});toast('Demodaten wiederhergestellt.');await load()};load();
</script></body></html>
