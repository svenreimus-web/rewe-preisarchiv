name: Einkaufsvergleich uebersichtlich machen

on:
  push:
    paths:
      - 'shopping_summary_redesign.py'
      - '.github/workflows/shopping-summary-redesign.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preisuebersicht umbauen
        run: python shopping_summary_redesign.py
      - name: JavaScript pruefen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          inline='\n'.join(x for x in scripts if x.strip())
          Path('/tmp/app.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Neue Preisaufstellung pruefen
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            ('Zwischensumme der gefundenen Angebote','Zwischensumme'),
            ('shoppingBreakdownTable','Aufschluesselung'),
            ('Positionspreis','Positionspreis'),
            ('Nicht gefundene Positionen zählen mit 0 €','Fehlende Positionen erklaert'),
            ('shop-market-detail','aufklappbare Maerkte')
          ]
          for needle,label in checks:
              if needle not in s: raise SystemExit(f'Fehlt: {label}')
          print('Darstellung OK')
          PY
      - name: Aenderung speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign shopping price breakdown"
          git push
