name: Rezeptlogik korrigieren

on:
  push:
    paths:
      - 'recipe_strict_patch.py'
      - '.github/workflows/recipe-strict-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rezeptlogik korrigieren
        run: python recipe_strict_patch.py
      - name: JavaScript prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Regression prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "if(!rows.length)return null" in s
          assert "recipeAnimalProduct" in s
          assert "spec.tags.includes('vegetarisch')" in s
          assert "else if(need.cats?.length)rows=rows.filter" not in s
          print('Rezept-Matching ist strikt und vegetarisch geschützt')
          PY
      - name: Änderung speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix recipe ingredient matching"
          git push
