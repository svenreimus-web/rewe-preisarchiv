name: Einkauf Gebinde korrigieren

on:
  push:
    paths:
      - 'shopping_packaging_patch.py'
      - '.github/workflows/shopping-packaging.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gebindelogik anwenden
        run: python shopping_packaging_patch.py
      - name: JavaScript prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          inline='\n'.join(x for x in scripts if x.strip())
          Path('/tmp/app.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Gebinderegeln testen
        run: |
          node - <<'JS'
          const specs={Bier:20,Wasser:12,'Cola & Limonade':12,Saft:6};
          function parse(s){const m=s.match(/\b(\d+)\s*[x×]\s*(\d+(?:[.,]\d+)?)\s*[- ]?\s*(?:l|ml)\b/i);return m?Number(m[1]):null}
          const tests=[
            [parse('20 x 0,5-l-Fl.-Kasten')===specs.Bier,'20er Bierkasten'],
            [parse('24 x 0,33 l')!==specs.Bier,'24er Bier darf nicht Standardkasten sein'],
            [parse('6 x 0,33 l')!==specs.Bier,'Sixpack darf nicht Bierkasten sein'],
            [parse('12 x 1 l')===specs.Wasser,'12er Wasserkasten'],
            [parse('12x1l')===specs['Cola & Limonade'],'12er Cola-Kasten'],
            [parse('6 x 1 l')===specs.Saft,'6er Saftkasten']
          ];
          for(const [ok,msg] of tests)if(!ok)throw new Error(msg);
          console.log('Gebinderegeln OK');
          JS
      - name: Semantik prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            ("Bier:{count:20",'Bier 20 Flaschen'),
            ("Wasser:{count:12",'Wasser 12 Flaschen'),
            ("'Cola & Limonade':{count:12",'Cola/Limo 12 Flaschen'),
            ("Saft:{count:6",'Saft 6 Flaschen'),
            ("if(t==='Butter')return{amount:1,unit:'Packung'",'Butter Packung'),
            ("if(t==='Margarine')return{amount:1,unit:'Packung'",'Margarine Packung'),
            ('offerPackInfo','Gebindeanzeige')
          ]
          for needle,label in checks:
              if needle not in s: raise SystemExit(f'Fehlt: {label}')
          print('Semantik OK')
          PY
      - name: Änderung speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use product-specific crate and package sizes"
          git push
