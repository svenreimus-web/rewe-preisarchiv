name: Einkaufstypen korrigieren

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-offers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Butter und Margarine trennen
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          old=" ['Butter & Margarine',['butter','margarine','latta']],"
          new=" ['Butter',['butter']],\n ['Margarine',['margarine','latta','rama']],"
          if old not in t:
              raise SystemExit('Butter/Margarine-Anker fehlt')
          t=t.replace(old,new,1)
          t=t.replace('<h2>Leichte Rezepte aus aktuellen Angeboten</h2>','<h2>Rezepte aus aktuellen Angeboten</h2>',1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: JavaScript prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          assert "['Butter',['butter']]" in text
          assert "['Margarine',['margarine','latta','rama']]" in text
          scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',text,re.S)
          Path('/tmp/app.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Split butter and margarine shopping types"
          git push
