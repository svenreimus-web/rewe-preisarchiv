name: Produktarten korrigieren

on:
  push:
    paths:
      - '.github/workflows/update-offers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Produktart-Erkennung korrigieren
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          old="function productType(p){const hay=norm(`${p.name||''} ${p.quantity||''}`);for(const [type,terms] of TYPE_RULES)if(terms.some(t=>phraseHit(hay,t)))return type;return category(p)}"
          new="""function strictTypeHit(text,term){const hay=norm(text),p=norm(term);if(!hay||!p)return false;if((` ${hay} `).includes(` ${p} `))return true;if(p.includes(' '))return false;return hay.split(' ').some(token=>{if(!token.startsWith(p))return false;const suffix=token.slice(p.length);return ['','e','en','er','n','s'].includes(suffix)})}\nconst DESC_TYPE_CATEGORY={'Bier':'Alkoholische Getränke','Wein':'Alkoholische Getränke','Sekt & Schaumwein':'Alkoholische Getränke','Spirituosen':'Alkoholische Getränke','Wasser':'Alkoholfreie Getränke','Cola & Limonade':'Alkoholfreie Getränke','Saft':'Alkoholfreie Getränke','Energy Drink':'Alkoholfreie Getränke','Kaffee':'Kaffee & Tee','Tee':'Kaffee & Tee'};\nfunction productType(p){const name=`${p.name||''} ${p.brand||''}`;for(const [type,terms] of TYPE_RULES)if(terms.some(t=>strictTypeHit(name,t)))return type;const cat=category(p),desc=p.quantity||'';for(const [type,terms] of TYPE_RULES)if(DESC_TYPE_CATEGORY[type]===cat&&terms.some(t=>strictTypeHit(desc,t)))return type;return cat}"""
          if old not in text:
              raise SystemExit('Alte productType-Funktion nicht gefunden')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          assert 'function strictTypeHit' in t
          assert "DESC_TYPE_CATEGORY={'Bier':'Alkoholische Getränke'" in t
          assert "const name=`${p.name||''} ${p.brand||''}`" in t
          print('Produktart-Logik erfolgreich eingebaut')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix false product type matches"
          git push
