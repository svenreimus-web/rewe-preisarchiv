name: Matching zentralisieren

on:
  push:
    paths:
      - 'refactor_matching.py'
      - '.github/workflows/refactor-matching.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Matching zentralisieren
        run: python refactor_matching.py
      - name: JavaScript prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          inline='\n'.join(x for x in scripts if x.strip())
          Path('/tmp/app.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Regressionstests für Matching
        run: |
          node - <<'JS'
          const norm=s=>(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}%]+/gu,' ').trim();
          const INF=new Set(['','e','en','er','n','s','es']);
          const COMP=new Set(['schwein','schweine','rind','rinder','hahnchen','hähnchen','pute','puten','fisch','lachs','kartoffel','apfel','äpfel']);
          const toks=t=>norm(t).split(' ').filter(Boolean);
          function rt(token,rule){if(token===rule)return true;if(token.startsWith(rule)&&INF.has(token.slice(rule.length)))return true;return COMP.has(rule)&&token.startsWith(rule)}
          function rule(text,phrase){const h=toks(text),p=toks(phrase);if(p.length===1)return h.some(t=>rt(t,p[0]));return false}
          function query(text,q){const h=toks(text),p=toks(q);return p.every(x=>h.some(t=>t===x||t.startsWith(x)))}
          const tests=[
            [!rule('Schweinefilets','wein'),'Schweinefilets darf nicht Wein sein'],
            [!rule('Schweine-Rückensteaks','wein'),'Schweine-Rückensteaks darf nicht Wein sein'],
            [!rule('Altbiersauce','altbier'),'Altbiersauce darf nicht Bier auslösen'],
            [!rule('Weizen-Kleingebäck','weizenbier'),'Weizen darf nicht Weizenbier auslösen'],
            [rule('Schweinefilets','schweine'),'Schweinefilets muss Schweinefleisch erkennen'],
            [rule('verschiedene Weine','wein'),'Weine muss Wein erkennen'],
            [rule('Rotwein trocken','rotwein'),'Rotwein muss explizit erkannt werden'],
            [!query('Frische Schweinefilets Fleisch','wein'),'Suche Wein darf Schweinefilets nicht treffen'],
            [query('Dostert verschiedene Weine','wein'),'Suche Wein muss Weine treffen'],
            [query('Ahr Spätburgunder Wein','wein'),'Suche Wein muss Produktart Wein treffen']
          ];
          for(const [ok,msg] of tests)if(!ok)throw new Error(msg);
          console.log('Matching-Regressionstests OK');
          JS
      - name: Änderung speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Centralize lexical product matching"
          git push
