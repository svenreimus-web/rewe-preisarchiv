name: Favoriten exakt korrigieren

on:
  push:
    paths:
      - 'favorite_exact_patch.py'
      - '.github/workflows/favorite-exact-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Favoritenlogik korrigieren
        run: python favorite_exact_patch.py
      - name: JavaScript prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Regression prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "function isProductFavorite(p){return favoriteProducts.has(productKey(p))}" in s
          assert "favoriteTypes.has(productType(p))" in s
          assert "lexicalQueryHit(text,k)" not in s
          print('Favoriten werden nur noch exakt über Produkt oder Produktart gematcht')
          PY
      - name: Änderung speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix exact matching for favorites"
          git push
