name: Einkaufsliste final optimieren

on:
  push:
    paths:
      - 'shopping_perf_units_refine.py'
      - '.github/workflows/shopping-refine.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Einkaufsliste optimieren
        run: python shopping_perf_units_refine.py
      - name: JavaScript prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Kernfunktionen prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=['categoryCache','productTypeCache','shoppingCategoryNames','amount:1,unit:\'Kasten\'','updateShoppingItem','SHOP_UNITS','setTimeout(applyShoppingSuggestion,80)','slice(0,100)']
          for c in checks:
              if c not in s: raise SystemExit('Fehlt: '+c)
          print('Finale Shopping-Prüfungen OK')
          PY
      - name: Änderung speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize fast shopping list quantities and units"
          git push
