<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#cc071e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Preisarchiv</title>
<style>
:root{--bg:#f5f5f7;--muted:#6b7280;--red:#cc071e;--green:#08752f;--border:#ddd;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#171717}button,input{font:inherit}header{background:#fff;border-bottom:1px solid #ddd;padding:16px;position:sticky;top:0;z-index:2}.wrap{max-width:1050px;margin:auto}h1{margin:0;font-size:24px}.sub,.status{font-size:13px;color:var(--muted);margin-top:5px}main{padding:0 16px 30px}.tabs{display:flex;gap:8px;padding:14px 0 0}.tab{border:1px solid var(--border);background:#fff;border-radius:999px;padding:9px 14px;font-weight:800}.tab.active{background:#171717;color:#fff;border-color:#171717}.controls{padding:12px 0 5px}.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid #d5d5d5;background:#fff;border-radius:999px;padding:8px 13px;font-size:14px}.filter.active{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}.markets{display:flex;gap:8px;margin-bottom:8px}.marketbtn{flex:1;border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 7px;font-size:14px;font-weight:700}.marketbtn.active{background:#171717;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}.card{background:#fff;border-radius:15px;padding:15px;box-shadow:0 1px 4px #0001;display:grid;grid-template-columns:64px 1fr;gap:12px}.pic{width:64px;height:64px;object-fit:contain;background:#f1f1f1;border-radius:9px}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin:4px 0 8px}.store{display:inline-block;font-size:11px;font-weight:800;padding:4px 7px;border-radius:6px;margin-bottom:8px;background:#fee2e2;color:#a40013}.store.globus{background:#dcfce7;color:#075d27}.row{display:flex;justify-content:space-between;align-items:center}.price{font-size:24px;font-weight:900}.graph{border:0;border-radius:50%;width:40px;height:40px;font-size:19px}.recipe-intro{background:#fff;border-radius:15px;padding:16px;margin-top:12px;box-shadow:0 1px 4px #0001}.recipe-intro h2{margin:0 0 6px;font-size:20px}.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}.recipe{background:#fff;border-radius:15px;padding:16px;box-shadow:0 1px 4px #0001}.recipe h3{margin:4px 0 6px;font-size:19px}.recipe-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tag{font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:#eef6ef;color:#075d27}.offer-list,.extra-list{margin:8px 0 10px;padding-left:20px}.offer-list li,.extra-list li{margin:5px 0}.offer-price{color:var(--muted);font-size:12px}.steps{margin:8px 0 0;padding-left:20px}.steps li{margin:7px 0;line-height:1.35}.recipe-total{font-weight:900;margin-top:10px}.hint{font-size:12px;color:var(--muted);line-height:1.4}.empty{background:#fff;border-radius:15px;padding:18px;color:var(--muted);margin-top:14px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.box{background:#fff;border-radius:16px;padding:18px;width:min(650px,100%);max-height:85vh;overflow:auto}.close{float:right;border:0;padding:8px;border-radius:8px}svg{width:100%;height:240px;border-left:1px solid #ddd;border-bottom:1px solid #ddd}.hist{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:9px 0}.hidden{display:none!important}@media(max-width:600px){.grid,.recipe-grid{grid-template-columns:1fr}.marketbtn{font-size:12px}.tabs{position:sticky;top:72px;background:var(--bg);z-index:1;padding-bottom:4px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Preisarchiv</h1><div class="sub">Angebote von REWE Weilbach und GLOBUS Hattersheim · gemeinsam vergleichen</div></div></header>
<main class="wrap">
<div class="tabs"><button id="tabOffers" class="tab active" onclick="setView('offers')">Angebote</button><button id="tabRecipes" class="tab" onclick="setView('recipes')">🥗 Rezepte aus Angeboten</button></div>
<section id="offersView">
<div class="controls"><div class="markets"><button id="mAlle" class="marketbtn active" onclick="setMarket('Alle')">Alle Märkte</button><button id="mREWE" class="marketbtn" onclick="setMarket('REWE')">REWE Weilbach</button><button id="mGLOBUS" class="marketbtn" onclick="setMarket('GLOBUS')">GLOBUS Hattersheim</button></div><input id="q" class="search" placeholder="Produkt suchen und Preise vergleichen …"><div id="filters" class="filters"></div></div>
<div id="status" class="status">Preisdaten werden geladen …</div><div id="grid" class="grid"></div>
</section>
<section id="recipesView" class="hidden">
<div class="recipe-intro"><h2>Leichte Rezepte aus aktuellen Angeboten</h2><div class="hint">Jedes Rezept verwendet Angebote aus genau einem Markt. Basiszutaten wie Öl, Salz und Gewürze werden separat aufgeführt.</div><div class="markets" style="margin-top:12px"><button id="rREWE" class="marketbtn active" onclick="setRecipeMarket('REWE')">REWE Weilbach</button><button id="rGLOBUS" class="marketbtn" onclick="setRecipeMarket('GLOBUS')">GLOBUS Hattersheim</button></div></div>
<div id="recipeStatus" class="status"></div><div id="recipeGrid" class="recipe-grid"></div>
</section>
</main>
<div id="modal" class="modal"><div class="box"><button class="close" onclick="modal.classList.remove('open')">✕</button><h2 id="mn"></h2><svg id="chart" viewBox="0 0 600 240" preserveAspectRatio="none"></svg><div id="history"></div></div></div>
<script>
let data=[],selected='Alle',market='Alle',view='offers',recipeMarket='REWE';
const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n||0));
function store(p){return p.store||p.market||'REWE'}
function text(p){return `${p.name||''} ${p.brand||''} ${p.quantity||''}`.toLowerCase()}
function category(p){const t=text(p);if(/bier|pils|radler|wein|aperol|sekt|champagner|prosecco|spirituose|likör|whisky|wodka|gin|rum/.test(t))return 'Alkoholische Getränke';if(/cola|limonade|limo|powerade|energy|saft|nektar|wasser|schorle|eistee|getränk/.test(t))return 'Alkoholfreie Getränke';if(/kaffee|espresso|cappuccino|kaffeepad|kaffeekapsel|tee\b/.test(t))return 'Kaffee & Tee';if(/rind|schwein|pute|hähn|huhn|fleisch|schnitzel|braten|gulasch|rouladen|hackfleisch|steak|filet/.test(t))return 'Fleisch';if(/salami|aufschnitt|wurst|schinken|würst|mortadella|leberwurst|bratwurst/.test(t))return 'Wurst & Aufschnitt';if(/fisch|lachs|forelle|garnele|garnelen|thunfisch|matjes|hering|kabeljau|seelachs/.test(t))return 'Fisch & Meeresfrüchte';if(/ei(er)?\b|eierpack|freiland|bodenhaltung/.test(t))return 'Eier';if(/tofu|vegan|vegetar|pflanzlich|veggie/.test(t))return 'Vegetarisch & Vegan';if(/käse|joghurt|quark|milch|butter|sahne|mozzarella|frischkäse|weichkäse|skyr|kefir|pudding/.test(t))return 'Molkerei & Käse';if(/apfel|äpfel|banane|beeren|erdbeer|traube|orange|mandarine|zitrone|melone|birne|kiwi|pfirsich|nektarine|ananas|mango/.test(t))return 'Obst';if(/rucola|tomate|gemüse|salat|kartoffel|möhren|karotte|gurke|paprika|zwiebel|zucchini|brokkoli|blumenkohl|pilz|champignon|spargel|kohl|avocado/.test(t))return 'Gemüse & Salat';if(/brot|bröt|toast|baguette|croissant|kuchen|torte|muffin|berliner|backware/.test(t))return 'Brot & Backwaren';if(/müsli|cornflakes|hafer|cerealien|brotaufstrich|honig/.test(t))return 'Frühstück';if(/pasta|nudel|reis|couscous|bulgur|quinoa/.test(t))return 'Nudeln, Reis & Beilagen';if(/tomatenmark|pesto|sauce|soße|ketchup|senf|mayonnaise|brühe|gewürz|kräuter|essig|öl\b/.test(t))return 'Saucen, Gewürze & Öl';if(/mehl|zucker|backpulver|vanille|backmischung/.test(t))return 'Backen';if(/konfitüre|marmelade|dose|konserve|bohnen|linsen|kichererbse/.test(t))return 'Konserven & Vorrat';if(/pizza|lasagne|fertiggericht|fertigmenü|ready|pfannengericht/.test(t))return 'Fertiggerichte';if(/tiefkühl|tk-|pommes/.test(t))return 'Tiefkühlkost';if(/eiscreme|speiseeis|eis am stiel|eisbecher/.test(t))return 'Eis';if(/chips|cracker|nüsse|nuss|erdnuss|snack|salzstangen|popcorn/.test(t))return 'Chips & Snacks';if(/schokolade|keks|kekse|gummi|bonbon|praline|knoppers|süß|riegel|waffel/.test(t))return 'Süßwaren';if(/baby|windel|pampers|babynahrung|brei/.test(t))return 'Baby';if(/toilettenpapier|küchenrolle|taschentücher|serviette/.test(t))return 'Papierwaren';if(/shampoo|duschgel|zahnpasta|deo\b|seife|rasierer|pflege|kosmetik/.test(t))return 'Drogerie & Körperpflege';if(/waschmittel|spülmittel|reiniger|putz|weichspüler|müllbeutel/.test(t))return 'Haushalt & Reinigung';if(/katze|katzen|hund|hunde|tierfutter|hundefutter|katzenfutter/.test(t))return 'Tierbedarf';if(/pfanne|topf|geschirr|glas|becher|folie|batterie|lampe|haushalt/.test(t))return 'Haushalt & Non-Food';return 'Weitere'}
function currentPrice(p){return Number(p.history?.at(-1)?.price||0)}
function drawFilters(){const cats=['Alle',...new Set(data.map(category))].sort((a,b)=>a==='Alle'?-1:b==='Alle'?1:a.localeCompare(b,'de'));filters.innerHTML=cats.map(c=>`<button class="filter ${c===selected?'active':''}" onclick="setFilter('${c.replaceAll("'","\\'")}')">${c}</button>`).join('')}
function setFilter(c){selected=c;drawFilters();render()}
function setMarket(m){market=m;['Alle','REWE','GLOBUS'].forEach(x=>document.getElementById('m'+x).classList.toggle('active',x===m));render()}
function setView(v){view=v;offersView.classList.toggle('hidden',v!=='offers');recipesView.classList.toggle('hidden',v!=='recipes');tabOffers.classList.toggle('active',v==='offers');tabRecipes.classList.toggle('active',v==='recipes');if(v==='recipes'){if(market!=='Alle')setRecipeMarket(market);else renderRecipes()}}
function setRecipeMarket(m){recipeMarket=m;['REWE','GLOBUS'].forEach(x=>document.getElementById('r'+x).classList.toggle('active',x===m));renderRecipes()}
async function load(){try{const r=await fetch('./data/offers.json?'+Date.now());if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();data=d.products||[];drawFilters();render();renderRecipes();status.textContent=data.length?data.length+' Angebote im Preisarchiv · Stand '+new Date(d.updated_at).toLocaleString('de-DE'):'Noch keine Angebote importiert.'}catch(e){status.textContent='Fehler beim Laden: '+e.message;recipeStatus.textContent='Rezepte konnten nicht geladen werden.'}}
function render(){const s=q.value.toLowerCase();const rows=data.filter(p=>(p.name+' '+(p.brand||'')+' '+(p.quantity||'')).toLowerCase().includes(s)).filter(p=>selected==='Alle'||category(p)===selected).filter(p=>market==='Alle'||store(p).toUpperCase().includes(market)).sort((a,b)=>a.name.localeCompare(b.name,'de',{sensitivity:'base'})||(currentPrice(a)-currentPrice(b)));grid.innerHTML=rows.map(p=>{const h=p.history||[],cur=currentPrice(p),multi=new Set(h.map(x=>x.price)).size>1,img=p.image?`<img class="pic" src="${p.image}" alt="">`:`<div class="pic"></div>`,st=store(p),isG=st.toUpperCase().includes('GLOBUS');return `<div class="card">${img}<div><div class="name">${p.name}</div><div class="meta">${[category(p),p.quantity].filter(Boolean).join(' · ')}</div><span class="store ${isG?'globus':''}">${isG?'GLOBUS Hattersheim':'REWE Weilbach'}</span><div class="row"><div class="price">${euro(cur)}</div><button class="graph" ${multi?`onclick="show('${p.id}')"`:'disabled'}>${multi?'📈':'—'}</button></div></div></div>`}).join('');if(!rows.length)grid.innerHTML='<div class="status">Keine Produkte in diesem Filter gefunden.</div>'}
function offered(m){return data.filter(p=>store(p).toUpperCase().includes(m)).sort((a,b)=>currentPrice(a)-currentPrice(b)||a.name.localeCompare(b.name,'de'))}
function firstMatch(items,re,used=new Set()){return items.find(p=>!used.has(p.id)&&re.test(text(p)))}
function makeRecipe(title,tags,slots,extras,steps){const items=offered(recipeMarket),used=new Set(),picked=[];for(const slot of slots){const p=firstMatch(items,slot.re,used);if(!p&&slot.required)return null;if(p){picked.push(p);used.add(p.id)}}if(picked.length<2)return null;return{title,tags,picked,extras,steps}}
function recipeCandidates(){const r=[];const add=x=>{if(x&&!r.some(y=>y.picked.map(p=>p.id).sort().join('|')===x.picked.map(p=>p.id).sort().join('|')))r.push(x)};
add(makeRecipe('Hähnchen-Gemüse-Pfanne',['leicht','proteinreich','ca. 25 Min.'],[{re:/hähn|huhn|pute/,required:true},{re:/paprika|zucchini|brokkoli|möhren|karotte|champignon|gemüse|salat/,required:true},{re:/reis|couscous|bulgur|quinoa/,required:false}],['1 TL Öl','Salz, Pfeffer, Paprika','etwas Wasser oder Brühe'],['Fleisch in Streifen schneiden und in wenig Öl anbraten.','Gemüse klein schneiden, zugeben und 8–10 Minuten bissfest garen.','Optional angebotene Beilage nach Packungsangabe garen und alles zusammen servieren.']));
add(makeRecipe('Fisch mit buntem Ofengemüse',['leicht','omega-3','ca. 30 Min.'],[{re:/lachs|forelle|kabeljau|seelachs|fisch/,required:true},{re:/kartoffel|paprika|zucchini|brokkoli|möhren|karotte|tomate|gemüse/,required:true},{re:/zitrone/,required:false}],['1–2 TL Olivenöl','Salz, Pfeffer, Kräuter'],['Gemüse schneiden, mit wenig Öl und Gewürzen mischen und bei 200 °C vorgaren.','Fisch nach etwa 12 Minuten dazugeben und weitere 12–15 Minuten garen.','Mit Zitrone oder Kräutern frisch abschmecken.']));
add(makeRecipe('Tofu-Gemüse-Wok',['vegan','leicht','ca. 20 Min.'],[{re:/tofu|vegan.*(filet|streifen|hack)|veggie/,required:true},{re:/paprika|zucchini|brokkoli|möhren|karotte|champignon|gemüse/,required:true},{re:/reis|nudel/,required:false}],['1 TL Öl','Sojasauce','Ingwer oder Knoblauch'],['Tofu würfeln und knusprig anbraten.','Gemüse kurz und heiß mitbraten, damit es bissfest bleibt.','Mit Sojasauce abschmecken und optional mit Reis oder Nudeln servieren.']));
add(makeRecipe('Mediterrane Pasta mit Gemüse',['vegetarisch','einfach','ca. 20 Min.'],[{re:/pasta|nudel|spaghetti|penne/,required:true},{re:/tomate|zucchini|paprika|champignon|gemüse/,required:true},{re:/pesto|tomatenmark|tomat.*sauce|pastasauce/,required:false},{re:/mozzarella|feta|hirtenkäse|parmesan/,required:false}],['1 TL Olivenöl','Salz, Pfeffer','italienische Kräuter'],['Pasta kochen.','Gemüse in wenig Öl anbraten und mit etwas Nudelwasser sowie Sauce oder Tomatenmark verbinden.','Pasta unterheben und optional Käse darübergeben.']));
add(makeRecipe('Kartoffel-Gemüse-Blech',['vegetarisch','viel Gemüse','ca. 35 Min.'],[{re:/kartoffel/,required:true},{re:/paprika|zucchini|brokkoli|möhren|karotte|champignon|tomate|gemüse/,required:true},{re:/feta|hirtenkäse|mozzarella|frischkäse/,required:false}],['1–2 TL Öl','Salz, Pfeffer, Kräuter'],['Kartoffeln klein würfeln und 10 Minuten vorgaren oder sehr klein schneiden.','Mit Gemüse, wenig Öl und Gewürzen mischen und bei 200 °C ca. 25 Minuten backen.','Optional Käse in den letzten Minuten darübergeben.']));
add(makeRecipe('Knackige Salat-Bowl',['frisch','leicht','ca. 15 Min.'],[{re:/salat|rucola|gurke/,required:true},{re:/tomate|paprika|avocado|möhren|karotte/,required:true},{re:/hähn|pute|thunfisch|lachs|tofu|feta|hirtenkäse|mozzarella|ei\b/,required:false}],['1 TL Olivenöl','Essig oder Zitronensaft','Salz, Pfeffer'],['Gemüse waschen und schneiden.','Optional Protein zubereiten bzw. abtropfen lassen.','Alles in einer Schüssel anrichten und mit einem leichten Essig-Öl-Dressing vermengen.']));
add(makeRecipe('Joghurt-Obst-Bowl',['Frühstück','proteinreich','5 Min.'],[{re:/skyr|joghurt|quark|kefir/,required:true},{re:/apfel|äpfel|banane|beeren|erdbeer|traube|orange|birne|kiwi|pfirsich|nektarine|mango/,required:true},{re:/müsli|hafer|cerealien|nüsse|nuss/,required:false}],['Zimt nach Geschmack'],['Joghurt, Skyr oder Quark in eine Schüssel geben.','Obst klein schneiden und darauf verteilen.','Optional Müsli, Haferflocken oder Nüsse darübergeben.']));
add(makeRecipe('Schnelle Tomaten-Reis-Pfanne',['vegetarisch','einfach','ca. 20 Min.'],[{re:/reis|couscous|bulgur|quinoa/,required:true},{re:/tomate|paprika|zucchini|gemüse/,required:true},{re:/bohnen|linsen|kichererbse/,required:false},{re:/feta|hirtenkäse|mozzarella/,required:false}],['1 TL Öl','Salz, Pfeffer','Paprikapulver oder Kräuter'],['Beilage nach Packungsangabe garen.','Gemüse klein schneiden und in wenig Öl braten.','Alles vermischen, würzen und optional Hülsenfrüchte oder Käse ergänzen.']));
return r.slice(0,6)}
function renderRecipes(){if(!data.length){recipeGrid.innerHTML='';return}const recipes=recipeCandidates();const marketName=recipeMarket==='GLOBUS'?'GLOBUS Hattersheim':'REWE Weilbach';recipeStatus.textContent=`${recipes.length} passende Rezeptvorschläge · nur aus Angeboten von ${marketName}`;recipeGrid.innerHTML=recipes.length?recipes.map(r=>{const total=r.picked.reduce((s,p)=>s+currentPrice(p),0);return `<article class="recipe"><span class="store ${recipeMarket==='GLOBUS'?'globus':''}">${marketName}</span><h3>${r.title}</h3><div class="recipe-tags">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><strong>Im Angebot:</strong><ul class="offer-list">${r.picked.map(p=>`<li>${p.name}<div class="offer-price">${p.quantity||''}${p.quantity?' · ':''}${euro(currentPrice(p))}</div></li>`).join('')}</ul><strong>Zusätzlich:</strong><ul class="extra-list">${r.extras.map(x=>`<li>${x}</li>`).join('')}</ul><strong>Zubereitung:</strong><ol class="steps">${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="recipe-total">Angebotsprodukte zusammen: ca. ${euro(total)}</div><div class="hint">Preis = Kaufpreis der verwendeten Angebotsprodukte, nicht anteiliger Rezeptpreis.</div></article>`}).join(''):`<div class="empty">Für ${marketName} sind in den aktuell eingelesenen Angeboten noch keine sinnvollen Kombinationen mit mindestens zwei passenden Zutaten vorhanden. Sobald passende Gemüse-, Protein-, Beilagen- oder Frühstücksangebote eingelesen werden, erscheinen hier automatisch Rezepte.</div>`}
function show(id){const p=data.find(x=>x.id===id),h=p.history||[];mn.textContent=p.name+' · '+(store(p).toUpperCase().includes('GLOBUS')?'GLOBUS Hattersheim':'REWE Weilbach');history.innerHTML=h.slice().reverse().map(x=>`<div class="hist"><span>${new Date(x.date+'T12:00:00').toLocaleDateString('de-DE')}</span><b>${euro(x.price)}</b></div>`).join('');let v=h.map(x=>x.price),lo=Math.min(...v),hi=Math.max(...v);if(lo===hi){lo-=.5;hi+=.5}let X=i=>30+540*(h.length===1?.5:i/(h.length-1)),Y=x=>210-180*(x-lo)/(hi-lo);chart.innerHTML=`<polyline fill="none" stroke="currentColor" stroke-width="4" points="${h.map((x,i)=>X(i)+','+Y(x.price)).join(' ')}"/>`;modal.classList.add('open')}
q.oninput=render;modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};load();
</script>
</body>
</html>
