<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#cc071e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="REWE Preise"><title>REWE Preisarchiv</title><style>:root{--red:#cc071e;--bg:#f5f5f7;--card:#fff;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#171717}header{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;padding:16px;z-index:2}.wrap{max-width:1050px;margin:auto}h1{margin:0;font-size:24px}.sub{font-size:13px;color:var(--muted);margin-top:4px}.controls{display:flex;gap:10px;padding:16px 0}input{flex:1;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}.status{color:var(--muted);font-size:13px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card{background:#fff;border-radius:15px;padding:15px;box-shadow:0 1px 4px #0001}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin:5px 0 15px}.row{display:flex;justify-content:space-between;align-items:center}.price{font-size:25px;font-weight:900}.graph{border:0;border-radius:50%;width:40px;height:40px;font-size:20px}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:5;padding:16px;align-items:center;justify-content:center}.modal.open{display:flex}.box{background:#fff;border-radius:16px;padding:18px;width:min(650px,100%);max-height:85vh;overflow:auto}.close{float:right;border:0;padding:8px;border-radius:8px}svg{width:100%;height:250px;border-left:1px solid #ddd;border-bottom:1px solid #ddd;margin-top:18px}.hist{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:9px 0;font-size:13px}main{padding:0 16px 30px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><h1>REWE Preisarchiv</h1><div class="sub">REWE Vigheshan Gahndi · Industriestraße 40 · Flörsheim-Weilbach</div></div></header><main class="wrap"><div class="controls"><input id="q" placeholder="Produkt suchen …"></div><div class="status" id="status">Daten werden geladen …</div><div class="grid" id="grid"></div></main><div class="modal" id="modal"><div class="box"><button class="close" onclick="modal.classList.remove('open')">✕</button><h2 id="mn"></h2><svg id="chart" viewBox="0 0 600 250" preserveAspectRatio="none"></svg><div id="history"></div></div></div><script>let data=[];const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n);async function load(){try{let r=await fetch('./data/prices.json?'+Date.now());data=await r.json();render();status.textContent=data.length+' Produkte im Preisarchiv · automatische Aktualisierung über GitHub'}catch(e){status.textContent='Noch keine Preisdaten vorhanden.'}}function render(){let s=q.value.toLowerCase();grid.innerHTML=data.filter(p=>(p.name+' '+(p.brand||'')).toLowerCase().includes(s)).map((p,i)=>{let h=p.history||[],cur=h.length?h[h.length-1].price:p.price,distinct=new Set(h.map(x=>x.price)).size>1;return `<div class="card"><div class="name">${p.name}</div><div class="meta">${p.brand||''}${p.quantity?' · '+p.quantity:''}</div><div class="row"><div class="price">${euro(cur)}</div><button class="graph" ${distinct?'onclick="show('+i+')"':'disabled'}>${distinct?'📈':'—'}</button></div></div>`}).join('')}function show(i){let p=data[i],h=p.history||[];mn.textContent=p.name;history.innerHTML=h.slice().reverse().map(x=>`<div class="hist"><span>${new Date(x.date).toLocaleDateString('de-DE')}</span><b>${euro(x.price)}</b></div>`).join('');let vals=h.map(x=>x.price),min=Math.min(...vals)-.1,max=Math.max(...vals)+.1,W=600,H=250,pad=30,x=j=>pad+(W-2*pad)*(h.length===1?.5:j/(h.length-1)),y=v=>H-pad-(H-2*pad)*(v-min)/(max-min);chart.innerHTML=`<polyline fill="none" stroke="currentColor" stroke-width="4" points="${h.map((v,j)=>x(j)+','+y(v.price)).join(' ')}"/>`+h.map((v,j)=>`<circle cx="${x(j)}" cy="${y(v.price)}" r="5" fill="currentColor"/>`).join('');modal.classList.add('open')}q.oninput=render;modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};load()</script></body></html>
