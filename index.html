<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#cc071e"><meta name="apple-mobile-web-app-capable" content="yes"><title>REWE Preisarchiv</title><style>:root{--bg:#f5f5f7;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#171717}header{background:#fff;border-bottom:1px solid #ddd;padding:16px;position:sticky;top:0}.wrap{max-width:1050px;margin:auto}h1{margin:0;font-size:24px}.sub,.status{font-size:13px;color:var(--muted);margin-top:5px}main{padding:0 16px 30px}.controls{padding:16px 0}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}.card{background:#fff;border-radius:15px;padding:15px;box-shadow:0 1px 4px #0001;display:grid;grid-template-columns:64px 1fr;gap:12px}.pic{width:64px;height:64px;object-fit:contain;background:#f1f1f1;border-radius:9px}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin:4px 0 12px}.row{display:flex;justify-content:space-between;align-items:center}.price{font-size:24px;font-weight:900}.graph{border:0;border-radius:50%;width:40px;height:40px;font-size:19px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.box{background:#fff;border-radius:16px;padding:18px;width:min(650px,100%);max-height:85vh;overflow:auto}.close{float:right;border:0;padding:8px;border-radius:8px}svg{width:100%;height:240px;border-left:1px solid #ddd;border-bottom:1px solid #ddd}.hist{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:9px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><h1>REWE Preisarchiv</h1><div class="sub">REWE Vigheshan Gahndi · Industriestraße 40 · Flörsheim-Weilbach · Markt 240367</div></div></header><main class="wrap"><div class="controls"><input id="q" placeholder="Produkt suchen …"></div><div id="status" class="status">Preisdaten werden geladen …</div><div id="grid" class="grid"></div></main><div id="modal" class="modal"><div class="box"><button class="close" onclick="modal.classList.remove('open')">✕</button><h2 id="mn"></h2><svg id="chart" viewBox="0 0 600 240" preserveAspectRatio="none"></svg><div id="history"></div></div></div><script>let data=[];const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n);async function load(){try{const r=await fetch('./data/offers.json?'+Date.now());if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();data=d.products||[];render();status.textContent=data.length?data.length+' Produkte im Preisarchiv · Stand '+new Date(d.updated_at).toLocaleString('de-DE'):'Noch keine echten Angebote importiert · automatischer Abruf ist eingerichtet.'}catch(e){status.textContent='Fehler beim Laden: '+e.message}}function render(){const s=q.value.toLowerCase();const rows=data.filter(p=>(p.name+' '+(p.brand||'')).toLowerCase().includes(s));grid.innerHTML=rows.map(p=>{const h=p.history||[],cur=h.at(-1)?.price??0,multi=new Set(h.map(x=>x.price)).size>1,img=p.image?`<img class="pic" src="${p.image}">`:`<div class="pic"></div>`;return `<div class="card">${img}<div><div class="name">${p.name}</div><div class="meta">${[p.brand,p.quantity,p.category].filter(Boolean).join(' · ')}</div><div class="row"><div class="price">${euro(cur)}</div><button class="graph" ${multi?`onclick="show('${p.id}')"`:'disabled'}>${multi?'📈':'—'}</button></div></div></div>`}).join('')}function show(id){const p=data.find(x=>x.id===id),h=p.history||[];mn.textContent=p.name;history.innerHTML=h.slice().reverse().map(x=>`<div class="hist"><span>${new Date(x.date+'T12:00:00').toLocaleDateString('de-DE')}</span><b>${euro(x.price)}</b></div>`).join('');let v=h.map(x=>x.price),lo=Math.min(...v),hi=Math.max(...v);if(lo===hi){lo-=.5;hi+=.5}let X=i=>30+540*(h.length===1?.5:i/(h.length-1)),Y=x=>210-180*(x-lo)/(hi-lo);chart.innerHTML=`<polyline fill="none" stroke="currentColor" stroke-width="4" points="${h.map((x,i)=>X(i)+','+Y(x.price)).join(' ')}"/>`;modal.classList.add('open')}q.oninput=render;modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};load()</script></body></html>
