<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#cc071e"><meta name="apple-mobile-web-app-capable" content="yes"><title>Preisarchiv</title><style>:root{--bg:#f5f5f7;--muted:#6b7280;--red:#cc071e;--green:#08752f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#171717}header{background:#fff;border-bottom:1px solid #ddd;padding:16px;position:sticky;top:0;z-index:2}.wrap{max-width:1050px;margin:auto}h1{margin:0;font-size:24px}.sub,.status{font-size:13px;color:var(--muted);margin-top:5px}main{padding:0 16px 30px}.controls{padding:16px 0 5px}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid #d5d5d5;background:#fff;border-radius:999px;padding:8px 13px;font-size:14px}.filter.active{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}.markets{display:flex;gap:8px;margin-bottom:5px}.marketbtn{flex:1;border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 7px;font-size:14px;font-weight:700}.marketbtn.active{background:#171717;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}.card{background:#fff;border-radius:15px;padding:15px;box-shadow:0 1px 4px #0001;display:grid;grid-template-columns:64px 1fr;gap:12px}.pic{width:64px;height:64px;object-fit:contain;background:#f1f1f1;border-radius:9px}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin:4px 0 8px}.store{display:inline-block;font-size:11px;font-weight:800;padding:4px 7px;border-radius:6px;margin-bottom:8px;background:#fee2e2;color:#a40013}.store.globus{background:#dcfce7;color:#075d27}.row{display:flex;justify-content:space-between;align-items:center}.price{font-size:24px;font-weight:900}.graph{border:0;border-radius:50%;width:40px;height:40px;font-size:19px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.box{background:#fff;border-radius:16px;padding:18px;width:min(650px,100%);max-height:85vh;overflow:auto}.close{float:right;border:0;padding:8px;border-radius:8px}svg{width:100%;height:240px;border-left:1px solid #ddd;border-bottom:1px solid #ddd}.hist{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:9px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}.marketbtn{font-size:12px}}</style></head><body><header><div class="wrap"><h1>Preisarchiv</h1><div class="sub">Angebote von REWE Weilbach und GLOBUS Hattersheim · gemeinsam vergleichen</div></div></header><main class="wrap"><div class="controls"><div class="markets"><button id="mAlle" class="marketbtn active" onclick="setMarket('Alle')">Alle Märkte</button><button id="mREWE" class="marketbtn" onclick="setMarket('REWE')">REWE Weilbach</button><button id="mGLOBUS" class="marketbtn" onclick="setMarket('GLOBUS')">GLOBUS Hattersheim</button></div><input id="q" placeholder="Produkt suchen und Preise vergleichen …"><div id="filters" class="filters"></div></div><div id="status" class="status">Preisdaten werden geladen …</div><div id="grid" class="grid"></div></main><div id="modal" class="modal"><div class="box"><button class="close" onclick="modal.classList.remove('open')">✕</button><h2 id="mn"></h2><svg id="chart" viewBox="0 0 600 240" preserveAspectRatio="none"></svg><div id="history"></div></div></div><script>let data=[],selected='Alle',market='Alle';const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n);function store(p){return p.store||p.market||'REWE'}function category(p){const t=(p.name+' '+(p.brand||'')+' '+(p.quantity||'')).toLowerCase();if(/bier|pils|radler|wein|aperol|sekt|champagner|prosecco|spirituose|likör|whisky|wodka|gin|rum/.test(t))return 'Alkoholische Getränke';if(/cola|limonade|limo|powerade|energy|saft|nektar|wasser|schorle|eistee|getränk/.test(t))return 'Alkoholfreie Getränke';if(/kaffee|espresso|cappuccino|kaffeepad|kaffeekapsel|tee\b/.test(t))return 'Kaffee & Tee';if(/rind|schwein|pute|hähn|huhn|fleisch|schnitzel|braten|gulasch|rouladen|hackfleisch|steak|filet/.test(t))return 'Fleisch';if(/salami|aufschnitt|wurst|schinken|würst|mortadella|leberwurst|bratwurst/.test(t))return 'Wurst & Aufschnitt';if(/fisch|lachs|forelle|garnele|garnelen|thunfisch|matjes|hering|kabeljau|seelachs/.test(t))return 'Fisch & Meeresfrüchte';if(/käse|joghurt|quark|milch|butter|sahne|mozzarella|frischkäse|weichkäse|skyr|kefir|pudding/.test(t))return 'Molkerei & Käse';if(/apfel|äpfel|banane|beeren|erdbeer|traube|orange|mandarine|zitrone|melone|birne|kiwi|pfirsich|nektarine|ananas/.test(t))return 'Obst';if(/rucola|tomate|gemüse|salat|kartoffel|möhren|karotte|gurke|paprika|zwiebel|zucchini|brokkoli|blumenkohl|pilz|champignon|spargel/.test(t))return 'Gemüse & Salat';if(/brot|bröt|toast|baguette|croissant|kuchen|torte|muffin|berliner|backware/.test(t))return 'Brot & Backwaren';if(/chips|cracker|nüsse|nuss|erdnuss|snack|salzstangen|popcorn/.test(t))return 'Chips & Snacks';if(/schokolade|keks|kekse|gummi|bonbon|praline|knoppers|süß|riegel|waffel/.test(t))return 'Süßwaren';if(/eiscreme|speiseeis|eis am stiel|eisbecher/.test(t))return 'Eis';if(/pizza|pommes|tiefkühl|tk-|lasagne|fertiggericht|fertigmenü/.test(t))return 'Tiefkühl & Fertiggerichte';if(/pasta|nudel|reis|mehl|zucker|öl\b|essig|pesto|tomatenmark|sauce|soße|konfitüre|marmelade|dose|konserve|gewürz|brühe/.test(t))return 'Vorrat & Kochen';if(/müsli|cornflakes|hafer|cerealien|brotaufstrich|honig/.test(t))return 'Frühstück';if(/tofu|vegan|vegetar|pflanzlich|veggie/.test(t))return 'Vegetarisch & Vegan';if(/baby|windel|pampers|babynahrung|brei/.test(t))return 'Baby';if(/shampoo|duschgel|zahnpasta|deo\b|seife|rasierer|pflege|kosmetik|toilettenpapier|küchenrolle|taschentücher/.test(t))return 'Drogerie & Körperpflege';if(/waschmittel|spülmittel|reiniger|putz|weichspüler|müllbeutel|haushalt/.test(t))return 'Haushalt & Reinigung';if(/katze|katzen|hund|hunde|tierfutter|hundefutter|katzenfutter/.test(t))return 'Tierbedarf';return 'Weitere'}function drawFilters(){const cats=['Alle',...new Set(data.map(category))].sort((a,b)=>a==='Alle'?-1:b==='Alle'?1:a.localeCompare(b,'de'));filters.innerHTML=cats.map(c=>`<button class="filter ${c===selected?'active':''}" onclick="setFilter('${c.replaceAll("'","\\'")}')">${c}</button>`).join('')}function setFilter(c){selected=c;drawFilters();render()}function setMarket(m){market=m;['Alle','REWE','GLOBUS'].forEach(x=>document.getElementById('m'+x).classList.toggle('active',x===m));render()}async function load(){try{const r=await fetch('./data/offers.json?'+Date.now());if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();data=d.products||[];drawFilters();render();status.textContent=data.length?data.length+' Angebote im Preisarchiv · Stand '+new Date(d.updated_at).toLocaleString('de-DE'):'Noch keine Angebote importiert.'}catch(e){status.textContent='Fehler beim Laden: '+e.message}}function render(){const s=q.value.toLowerCase();const rows=data.filter(p=>(p.name+' '+(p.brand||'')+' '+(p.quantity||'')).toLowerCase().includes(s)).filter(p=>selected==='Alle'||category(p)===selected).filter(p=>market==='Alle'||store(p).toUpperCase().includes(market)).sort((a,b)=>a.name.localeCompare(b.name,'de',{sensitivity:'base'})||((a.history?.at(-1)?.price||0)-(b.history?.at(-1)?.price||0)));grid.innerHTML=rows.map(p=>{const h=p.history||[],cur=h.at(-1)?.price??0,multi=new Set(h.map(x=>x.price)).size>1,img=p.image?`<img class="pic" src="${p.image}">`:`<div class="pic"></div>`,st=store(p),isG=st.toUpperCase().includes('GLOBUS');return `<div class="card">${img}<div><div class="name">${p.name}</div><div class="meta">${[category(p),p.quantity].filter(Boolean).join(' · ')}</div><span class="store ${isG?'globus':''}">${isG?'GLOBUS Hattersheim':'REWE Weilbach'}</span><div class="row"><div class="price">${euro(cur)}</div><button class="graph" ${multi?`onclick="show('${p.id}')"`:'disabled'}>${multi?'📈':'—'}</button></div></div></div>`}).join('');if(!rows.length)grid.innerHTML='<div class="status">Keine Produkte in diesem Filter gefunden.</div>'}function show(id){const p=data.find(x=>x.id===id),h=p.history||[];mn.textContent=p.name+' · '+(store(p).toUpperCase().includes('GLOBUS')?'GLOBUS Hattersheim':'REWE Weilbach');history.innerHTML=h.slice().reverse().map(x=>`<div class="hist"><span>${new Date(x.date+'T12:00:00').toLocaleDateString('de-DE')}</span><b>${euro(x.price)}</b></div>`).join('');let v=h.map(x=>x.price),lo=Math.min(...v),hi=Math.max(...v);if(lo===hi){lo-=.5;hi+=.5}let X=i=>30+540*(h.length===1?.5:i/(h.length-1)),Y=x=>210-180*(x-lo)/(hi-lo);chart.innerHTML=`<polyline fill="none" stroke="currentColor" stroke-width="4" points="${h.map((x,i)=>X(i)+','+Y(x.price)).join(' ')}"/>`;modal.classList.add('open')}q.oninput=render;modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};load()</script></body></html>
