<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#cc071e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="REWE Preise"><link rel="manifest" href="manifest.webmanifest"><title>REWE Preisarchiv Weilbach</title><style>:root{--r:#cc071e;--bg:#f4f5f7;--muted:#68707a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:#17191c}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;z-index:3}.wrap{max-width:1100px;margin:auto;padding:16px}h1{font-size:23px;margin:0}.sub,.status{font-size:13px;color:var(--muted);margin-top:4px}.controls{display:grid;grid-template-columns:1fr 220px;gap:10px;margin:15px 0}input,select{padding:12px;border:1px solid #ddd;border-radius:11px;background:white;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:13px}.card{background:#fff;border:1px solid #e1e1e1;border-radius:15px;padding:14px;display:grid;grid-template-columns:68px 1fr;gap:12px}.pic{width:68px;height:68px;border-radius:10px;background:#f1f1f1;display:grid;place-items:center;font-size:25px;object-fit:contain}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:3px}.row{display:flex;align-items:end;justify-content:space-between;margin-top:14px}.price{font-size:24px;font-weight:900}.range{font-size:11px;color:var(--muted)}button{border:0;border-radius:50%;width:40px;height:40px;font-size:19px}.active{background:#e8f4ec}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:15px;z-index:9}.modal.open{display:flex}.dialog{background:white;border-radius:16px;padding:18px;width:min(700px,100%);max-height:90vh;overflow:auto}.head{display:flex;justify-content:space-between}.close{border-radius:9px;width:auto;height:auto;padding:7px 11px}svg{width:100%;height:260px;margin-top:16px;border-left:1px solid #ddd;border-bottom:1px solid #ddd}.hist{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:9px 0;font-size:13px}@media(max-width:600px){.controls{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><header><div class="wrap"><h1>REWE Preisarchiv</h1><div class="sub" id="store">Industriestraße 40 · Flörsheim-Weilbach</div></div></header><main class="wrap"><div class="controls"><input id="q" placeholder="Produkt suchen …"><select id="cat"><option value="">Alle Kategorien</option></select></div><div class="status" id="status">Daten werden geladen …</div><div class="grid" id="grid"></div></main><div class="modal" id="modal"><div class="dialog"><div class="head"><div><div class="name" id="mn"></div><div class="meta" id="mm"></div></div><button class="close" onclick="modal.classList.remove('open')">✕</button></div><svg id="chart" viewBox="0 0 680 260" preserveAspectRatio="none"></svg><div id="history"></div></div></div><script>let P=[];const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n),de=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE');async function load(){let d=await fetch('data/offers.json?'+Date.now()).then(r=>r.json());P=d.products||[];store.textContent=d.store.address;status.textContent=`${P.length} Produkte · Stand ${new Date(d.updated_at).toLocaleString('de-DE')}`;[...new Set(P.map(x=>x.category).filter(Boolean))].sort().forEach(x=>cat.add(new Option(x,x)));render()}function render(){let s=q.value.toLowerCase(),c=cat.value;grid.innerHTML=P.filter(p=>(!s||(p.name+' '+(p.brand||'')).toLowerCase().includes(s))&&(!c||p.category===c)).map(p=>{let h=p.history||[],cur=h.at(-1)?.price??0,vals=h.map(x=>x.price),multi=new Set(vals).size>1,img=p.image?`<img class="pic" src="${p.image}">`:`<div class="pic">▧</div>`;return `<div class="card">${img}<div><div class="name">${p.name}</div><div class="meta">${[p.brand,p.category].filter(Boolean).join(' · ')}</div><div class="row"><div><div class="price">${euro(cur)}</div>${multi?`<div class="range">${euro(Math.min(...vals))} – ${euro(Math.max(...vals))}</div>`:''}</div><button ${multi?'class="active"':'disabled'} onclick="show('${p.id}')">📈</button></div></div></div>`}).join('')}function show(id){let p=P.find(x=>x.id===id),h=p.history||[];mn.textContent=p.name;mm.textContent=p.brand||'';history.innerHTML=h.slice().reverse().map(x=>`<div class="hist"><span>${de(x.date)}</span><strong>${euro(x.price)}</strong></div>`).join('');draw(h);modal.classList.add('open')}function draw(h){chart.innerHTML='';if(!h.length)return;let ns='http://www.w3.org/2000/svg',W=680,H=260,pad=35,v=h.map(x=>x.price),lo=Math.min(...v),hi=Math.max(...v);if(lo===hi){lo-=.5;hi+=.5}let X=i=>pad+(W-2*pad)*(h.length===1?.5:i/(h.length-1)),Y=x=>H-pad-(H-2*pad)*(x-lo)/(hi-lo),pl=document.createElementNS(ns,'polyline');pl.setAttribute('points',h.map((x,i)=>`${X(i)},${Y(x.price)}`).join(' '));pl.setAttribute('fill','none');pl.setAttribute('stroke','#12833a');pl.setAttribute('stroke-width','4');chart.appendChild(pl);h.forEach((x,i)=>{let c=document.createElementNS(ns,'circle');c.setAttribute('cx',X(i));c.setAttribute('cy',Y(x.price));c.setAttribute('r','6');c.setAttribute('fill','#12833a');chart.appendChild(c)})}q.oninput=render;cat.onchange=render;modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};load().catch(e=>status.textContent='Fehler beim Laden der Preisdaten: '+e.message)</script></body></html>
